name: Test

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
        - django: "4.2"
          postgres: "12"
        - django: "5.0"
          postgres: "12"
        - django: "5.1"
          postgres: "13"
        - django: "5.2"
          postgres: "14"
        - django: "6.0"
          postgres: "14"
        - django: "6.1"
          postgres: "15"

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Setup python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Django==${{ matrix.django-version }}" psycopg[binary] pytest
          python -m pip install .

      - name: Print Django version
        run: python -m django --version

      - name: Run tests
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        run: python -m django test tests --settings=tests.settings -v 2
